name: Daily Podcast Automation

on:
  schedule:
    # Every day at 01:00 UTC (08:00 WIB)
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run PaperPulse AI Pipeline
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.openai.com/v1' }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'gpt-4o-mini' }}
          LLM_MAX_TOKENS: ${{ secrets.LLM_MAX_TOKENS || '4096' }}
          FEED_URL: https://paperpulse-d8w.pages.dev/feed.xml
          SITE_URL: https://paperpulse-d8w.pages.dev
          EPISODES_BASE_URL: https://paperpulse-d8w.pages.dev/episodes
          COVER_URL: https://paperpulse-d8w.pages.dev/cover.png
          PODCAST_AUTHOR: PaperPulse AI
          PODCAST_EMAIL: azharabdussalaam2@gmail.com
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          python main.py --run

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy public --project-name paperpulse

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml output/episodes/ public/
          git diff --staged --quiet || (git commit -m "Auto-generate daily episode $(date -u +'%Y-%m-%d')" && git push)
